<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Number Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Enter your lucky no:</h1>
    <input type="number" id="number">
    <button type="button" id="click">Click</button>
    <h1 id="result">Result</h1>
</body>

<script>
    const number = document.getElementById("number")
    const click = document.getElementById("click")
    const result = document.getElementById("result")

    click.addEventListener("click", () => {
        const computer_lucky_no = Math.floor(Math.random() * 10)
        console.log(computer_lucky_no)

        if (number.value == computer_lucky_no) {
            result.textContent = "You won the game!! 🎉🎉"
        } else {
            result.textContent = `You loose the game 😞. Computer lucky number is ${computer_lucky_no}`
        }
    })
</script>

</html>
